name: m3_pad
description: 紙伝票（「寿」フォーマット）をデジタル化する伝票入力アプリ。
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.2 <4.0.0'

dependencies:
  cupertino_icons: ^1.0.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  path: ^1.8.3
  path_provider: ^2.1.2
  share_plus: ^13.3.0
  sqflite: ^2.3.2
  ulid: ^2.2.0

dev_dependencies:
  build_runner: ^2.4.9
  flutter_test:
    sdk: flutter
  mockito: ^5.4.2

flutter:
  uses-material-design: true
